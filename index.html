<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة متجر التمور المتطور</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --primary: #d97706; --danger: #ef4444; --border: #334155; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; direction: rtl; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2, h3 { color: var(--primary); text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 14px; box-sizing: border-box; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; border: none; background: var(--primary); }
        button:hover { filter: brightness(1.2); }
        .target-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; text-align: center; }
        .stat-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border); font-size: 13px; }
        .delete-btn { background: var(--danger); padding: 5px 10px; border-radius: 4px; cursor: pointer; color: white; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>🌴 نظام إدارة متجر التمور</h2>

    <!-- التارجت -->
    <div class="card">
        <h3>🎯 إعداد ومتابعة التارجت</h3>
        <input type="number" id="input-monthly-target" placeholder="التارجت الشهري">
        <button onclick="setTarget()">تثبيت التارجت</button>
        <input type="number" id="input-daily-sales" placeholder="مبيعات اليوم">
        <button onclick="addSales()" style="background:#2563eb;">إضافة مبيعات اليوم</button>
        <div class="target-grid" style="margin-top:15px;">
            <div class="stat-box"><span>الشهري</span><strong id="disp-monthly">0</strong></div>
            <div class="stat-box"><span>المحقق</span><strong id="disp-achieved">0</strong></div>
            <div class="stat-box"><span>المتبقي</span><strong id="disp-remaining" style="color:#ef4444;">0</strong></div>
        </div>
    </div>

    <!-- المخزون -->
    <div class="card">
        <h3>📦 إدارة المخزون والعجز</h3>
        <div style="display:flex; gap:5px;">
            <input type="text" id="new-item" placeholder="اسم صنف جديد">
            <button onclick="addItem()" style="width:auto; background:#059669;">إضافة</button>
        </div>
        <select id="item-selector"><option value="">اختر الصنف...</option></select>
        <div style="display:flex; gap:5px;">
            <input type="number" id="qty-input" placeholder="الكمية">
            <select id="unit-selector"><option value="كيلو">كيلو</option><option value="علبة">علبة</option></select>
        </div>
        <button onclick="addShortage()">تسجيل العجز</button>
        <table id="shortage-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>حذف</th></tr></thead><tbody></tbody></table>
    </div>
</div>

<script>
    let appData = JSON.parse(localStorage.getItem('store_v_final')) || { 
        monthlyTarget: 0, achievedSales: 0, items: [], shortages: [] 
    };

    function saveData() {
        localStorage.setItem('store_v_final', JSON.stringify(appData));
        render();
    }

    function setTarget() {
        appData.monthlyTarget = parseFloat(document.getElementById('input-monthly-target').value) || 0;
        saveData();
    }

    function addSales() {
        appData.achievedSales += parseFloat(document.getElementById('input-daily-sales').value) || 0;
        saveData();
    }

    function addItem() {
        const val = document.getElementById('new-item').value;
        if(val) { appData.items.push(val); saveData(); document.getElementById('new-item').value = ''; }
    }

    function addShortage() {
        const item = document.getElementById('item-selector').value;
        const qty = document.getElementById('qty-input').value;
        if(item && qty) {
            appData.shortages.unshift({ id: Date.now(), item, qty });
            saveData();
        }
    }

    function deleteShortage(id) {
        appData.shortages = appData.shortages.filter(s => s.id !== id);
        saveData();
    }

    function render() {
        document.getElementById('disp-monthly').innerText = appData.monthlyTarget;
        document.getElementById('disp-achieved').innerText = appData.achievedSales;
        document.getElementById('disp-remaining').innerText = appData.monthlyTarget - appData.achievedSales;

        const sel = document.getElementById('item-selector');
        sel.innerHTML = '<option value="">اختر الصنف...</option>';
        appData.items.forEach(i => sel.innerHTML += `<option value="${i}">${i}</option>`);

        const table = document.querySelector('#shortage-table tbody');
        table.innerHTML = '';
        appData.shortages.forEach(s => {
            table.innerHTML += `<tr><td>${s.item}</td><td>${s.qty}</td>
            <td><button class="delete-btn" onclick="deleteShortage(${s.id})">حذف</button></td></tr>`;
        });
    }

    window.onload = render;
</script>
</body>
</html>
