<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة تمور الطحان</title>
    <style>
        :root { 
            --bg-color: #080c14; 
            --card-bg: rgba(18, 24, 38, 0.92); 
            --text-color: #f8fafc; 
            --primary: #f59e0b; 
            --primary-light: #fbbf24;
            --danger: #ef4444; 
            --border: rgba(255, 255, 255, 0.08); 
            --success: #22c55e; 
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(rgba(8, 12, 20, 0.88), rgba(8, 12, 20, 0.88)), url('https://up6.cc/2026/08/178661253901061.png') no-repeat center center fixed; 
            background-size: cover; 
            color: var(--text-color); 
            margin: 0; 
            padding: 0; 
            direction: rtl; 
        }

        /* شريط التنقل العلوي المتجاوب للهاتف */
        .game-navbar {
            background: rgba(10, 14, 23, 0.98);
            border-bottom: 2px solid rgba(245, 158, 11, 0.2);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
            border: 2px solid #fbbf24;
            flex-shrink: 0;
        }

        .brand-text h3 {
            margin: 0;
            font-size: 13px;
            color: #fff;
        }

        .brand-text span {
            font-size: 10px;
            color: var(--primary-light);
            font-weight: bold;
        }

        /* أزرار القائمة في المنتصف ومتناسقة للهواتف */
        .nav-links {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 0 auto;
        }

        .nav-link {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 8px;
            position: relative;
            transition: 0.3s;
            white-space: nowrap;
        }

        .nav-link:hover, .nav-link.active {
            color: #fff;
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #f59e0b, #38bdf8);
            box-shadow: 0 0 8px #f59e0b;
        }

        .container { 
            max-width: 850px; 
            margin: 15px auto; 
            padding: 0 10px; 
            box-sizing: border-box;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card { 
            background: var(--card-bg); 
            border-radius: 10px; 
            padding: 15px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
            backdrop-filter: blur(8px);
        }

        h2, h3 { color: var(--primary-light); text-align: center; margin-top: 0; font-size: 16px; }
        
        input, select, button { 
            width: 100%; 
            padding: 10px; 
            margin: 6px 0; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: rgba(15, 23, 42, 0.9); 
            color: white; 
            font-size: 13px; 
            box-sizing: border-box; 
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        button { font-weight: bold; cursor: pointer; transition: 0.2s; border: none; background: var(--primary); color: #fff; }
        button:hover { filter: brightness(1.2); }
        
        .target-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 12px; }
        .stat-box { background: rgba(15, 23, 42, 0.7); padding: 8px 4px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; }
        .stat-box strong { font-size: 13px; }
        
        .progress-container { width: 100%; background: rgba(15, 23, 42, 0.9); border-radius: 8px; height: 16px; border: 1px solid var(--border); overflow: hidden; position: relative; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.4s ease-in-out; }
        .progress-text { text-align: center; font-size: 11px; margin-top: 4px; color: #cbd5e1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 8px 5px; text-align: center; border-bottom: 1px solid var(--border); font-size: 12px; }
        th { color: var(--primary-light); }
        
        .edit-btn { background: #2563eb; padding: 4px 8px; border-radius: 4px; color: white; border: none; font-size: 11px; }
        .delete-btn { background: var(--danger); padding: 4px 8px; border-radius: 4px; color: white; border: none; font-size: 11px; }

        /* صفوف الإدخال المجاورة لتناسب الشاشات الصغيرة */
        .flex-row { display: flex; gap: 6px; align-items: center; }
        
        @media (max-width: 600px) {
            .game-navbar { padding: 8px 10px; }
            .nav-brand { gap: 6px; }
            .brand-logo { width: 32px; height: 32px; font-size: 14px; }
            .brand-text h3 { font-size: 11px; }
            .brand-text span { font-size: 9px; }
            .nav-links { gap: 4px; }
            .nav-link { font-size: 11px; padding: 4px 5px; }
            .card { padding: 12px; }
            .hide-on-mobile { display: none; }
        }
    </style>
</head>
<body>

            <button class="nav-link" onclick="switchTab(1)">الإحصائيات</button>
            <button class="nav-link" onclick="switchTab(2)">المخزونات</button>
        </nav>
        <div class="hide-on-mobile" style="font-size: 11px; color: var(--primary-light); font-weight: bold;">🌴 تمور الطحان</div>
    </header>

<div class="container">

    <!-- القسم الأول: مبيعات والتارجت -->

    </div>

            </div>
            <select id="item-selector"><option value="">اختر الصنف والسعر...</option></select>
            <div class="flex-row">
                <input type="number" id="qty-input" placeholder="الكمية">
                <select id="unit-selector" style="width: 100px;"><option value="كيلو">كيلو</option><option value="علبة">علبة</option><option value="باكت">باكت</option><option value="قطعة">قطعة</option></select>
            </div>
            <button onclick="addShortage()">تسجيل العجز</button>
            <table id="shortage-table"><thead><tr><th>الصنف</th><th>الكمية</th><th>حذف</th></tr></thead><tbody></tbody></table>
        </div>
    </div>

</div>

    document.getElementById('sale-date').value = todayStr;

    document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('ar-EG', options);

    function saveData() {
        localStorage.setItem('store_v_final', JSON.stringify(appData));
        render();
    }

    function switchTab(index) {
        const buttons = document.querySelectorAll('.nav-link');
        const contents = document.querySelectorAll('.tab-content');
        
        buttons.forEach((btn, i) => {
            if(i === index) {
                btn.classList.add('active');
                contents[i].classList.add('active');
            } else {
                btn.classList.remove('active');
                contents[i].classList.remove('active');
            }
        });
    }

    function setTarget() {
        appData.monthlyTarget = parseFloat(document.getElementById('input-monthly-target').value) || 0;
        saveData();
    }

    function addSales() {
        const val = parseFloat(document.getElementById('input-daily-sales').value) || 0;
        if(val > 0) {
            appData.achievedSales += val;
            appData.dailyRecords.unshift({ id: Date.now(), date: todayStr, amount: val });
            document.getElementById('input-daily-sales').value = '';
            saveData();
        }
    }

        const amount = parseFloat(document.getElementById('sale-amount').value) || 0;
        if(date && amount > 0) {
            appData.dailyRecords.unshift({ id: Date.now(), date, amount });
            const recordMonth = date.substring(0, 7);
            const currentMonth = todayStr.substring(0, 7);
            if(recordMonth === currentMonth) {
                appData.achievedSales += amount;
            }
            document.getElementById('sale-amount').value = '';
            saveData();
        }
    }

    function editRecord(id) {
        const rec = appData.dailyRecords.find(r => r.id === id);
        if(rec) {
            const newAmount = prompt("تعديل قيمة المبيعات:", rec.amount);
            if(newAmount !== null) {
                const parsedAmount = parseFloat(newAmount);
                if(!isNaN(parsedAmount)) {
                    const recordMonth = rec.date.substring(0, 7);
                    const currentMonth = todayStr.substring(0, 7);
                    
                    if(recordMonth === currentMonth) {
                        appData.achievedSales = appData.achievedSales - rec.amount + parsedAmount;
                    }
                    rec.amount = parsedAmount;
                    saveData();
                }
            }
        }
    }

    function addItem() {
        const val = document.getElementById('new-item').value;
        if(val) { 
            appData.items.push(val); 
            saveData(); 
            document.getElementById('new-item').value = ''; 
        }
    }

    function addShortage() {
        const item = document.getElementById('item-selector').value;
        const qty = document.getElementById('qty-input').value;
        const unit = document.getElementById('unit-selector').value;
        if(item && qty) {
            appData.shortages.unshift({ id: Date.now(), item, qty: `${qty} ${unit}` });
            saveData();
        }
    }

    function deleteShortage(id) {
        appData.shortages = appData.shortages.filter(s => s.id !== id);
        saveData();
    }

    function render() {
        document.getElementById('disp-monthly').innerText = appData.monthlyTarget;
        document.getElementById('disp-achieved').innerText = appData.achievedSales;
        document.getElementById('disp-remaining').innerText = appData.monthlyTarget - appData.achievedSales;

        let percentage = 0;
        if (appData.monthlyTarget > 0) {
            percentage = Math.min((appData.achievedSales / appData.monthlyTarget) * 100, 100);
        }
        document.getElementById('progress-bar').style.width = percentage + "%";
        document.getElementById('progress-text').innerText = "نسبة الإنجاز: " + percentage.toFixed(1) + "%";

        const currentMonthPrefix = todayStr.substring(0, 7);
        document.getElementById('current-month-title').innerText = `أيام مبيعات شهر: ${currentMonthPrefix}`;
        
        const monthlyTable = document.querySelector('#monthly-sales-table tbody');
        monthlyTable.innerHTML = '';
        
        const currentMonthRecords = appData.dailyRecords.filter(r => r.date.startsWith(currentMonthPrefix));
        currentMonthRecords.forEach(r => {
            monthlyTable.innerHTML += `<tr><td>${r.date}</td><td>${r.amount}</td>
            <td><button class="edit-btn" onclick="editRecord(${r.id})">تعديل</button></td></tr>`;
        });

        const yearlyTable = document.querySelector('#yearly-stats-table tbody');
        yearlyTable.innerHTML = '';
        const currentYear = new Date().getFullYear();
        const monthNames = ["يناير", "فبراير", "مارس", "إبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        
        let totalYearSales = 0;

        for(let m = 1; m <= 12; m++) {
            let monthPrefix = `${currentYear}-${m < 10 ? '0' + m : m}`;
            let totalMonthSales = appData.dailyRecords
                .filter(r => r.date.startsWith(monthPrefix))
                .reduce((sum, r) => sum + r.amount, 0);
            
            totalYearSales += totalMonthSales;
            yearlyTable.innerHTML += `<tr><td>${monthNames[m-1]}</td><td><strong>${totalMonthSales}</strong></td></tr>`;
        }

        document.getElementById('total-year-to-date').innerText = totalYearSales;

        const sel = document.getElementById('item-selector');
        sel.innerHTML = '<option value="">اختر الصنف والسعر...</option>';
        appData.items.forEach(i => sel.innerHTML += `<option value="${i}">${i}</option>`);

        const table = document.querySelector('#shortage-table tbody');
        table.innerHTML = '';
        appData.shortages.forEach(s => {
            table.innerHTML += `<tr><td>${s.item}</td><td>${s.qty}</td>
            <td><button class="delete-btn" onclick="deleteShortage(${s.id})">حذف</button></td></tr>`;
        });
    }

    window.onload = render;
</script>
</body>
</html>
